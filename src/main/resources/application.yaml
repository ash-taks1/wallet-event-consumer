spring:
  application:
    name: wallet-event-consumer
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5440}/${DB_NAME:consumer}
    username: ${DB_USER:consumer}
    password: ${DB_PASSWORD:consumer}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:wallet}
    password: ${RABBITMQ_PASSWORD:wallet}
    listener:
      simple:
        # Ack only after the listener returned, i.e. after the inbox transaction committed.
        acknowledge-mode: auto
        prefetch: 20
        # Exhausted retries go to the dead-letter queue instead of being requeued forever.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 500ms
          multiplier: 2
          max-interval: 5s

server:
  port: 8091

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    tags-sorter: alpha
